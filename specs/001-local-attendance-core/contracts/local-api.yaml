openapi: 3.0.3
info:
  title: Local Attendance Core API
  version: 0.1.0
  description: >
    Local PC API for employee enrollment, facial attendance verification,
    duplicate blocking, and shift activity. Cloud dashboard, reports, exports,
    and manual corrections are outside this feature.
servers:
  - url: http://localhost:8000
    description: Local development server
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Authenticate a local user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated local user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /employees:
    get:
      summary: Search active employees for attendance selection
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Employee search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeSummary'
    post:
      summary: Create an employee profile
      description: Requires local admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
        '403':
          description: User does not have permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Employee number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /employees/{employee_id}:
    patch:
      summary: Update an employee profile
      description: Requires local admin role.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an employee with no attendance history
      description: >
        Requires local admin role. Refused with 409 if the employee has any
        verification attempts or attendance events, since that history must
        remain permanent and auditable — deactivate the employee instead
        (PATCH active=false) rather than deleting them.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '204':
          description: Employee deleted
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Employee has attendance or verification history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /employees/{employee_id}/face:
    post:
      summary: Enroll or re-enroll an employee facial reference
      description: Requires local admin role. The server captures from the fixed camera.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceEnrollmentRequest'
      responses:
        '200':
          description: Face reference enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentResponse'
        '400':
          description: Capture unusable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /attendance/verify:
    post:
      summary: Verify face and record attendance when successful
      description: Requires local guard or admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceVerifyRequest'
      responses:
        '200':
          description: Verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceVerifyResponse'
        '400':
          description: Invalid request, inactive employee, unusable camera capture, or missing face reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /attendance/camera-preview:
    get:
      summary: Single-frame JPEG snapshot from the fixed camera
      description: >
        Display-only preview so the guard's UI can confirm the camera sees a
        usable face before verification. Never used for face comparison and
        never persisted; a fresh frame is captured on every call.
      responses:
        '200':
          description: JPEG image of the current camera frame
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Camera could not capture a usable frame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User does not have permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /attendance/shift-activity:
    get:
      summary: View recent local attendance and verification activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Recent local activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftActivityItem'
  /dashboard/overview:
    get:
      summary: Local fallback overview for today's attendance
      responses:
        '200':
          description: Local overview counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalOverview'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EmployeeId:
      name: employee_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        user:
          $ref: '#/components/schemas/LocalUser'
    LocalUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, guard]
    EmployeeCreate:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
        employee_number:
          type: string
          description: Optional. Generated when omitted.
        department:
          type: string
        job_title:
          type: string
        phone:
          type: string
        notes:
          type: string
    EmployeeUpdate:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
        employee_number:
          type: string
        department:
          type: string
        job_title:
          type: string
        phone:
          type: string
        notes:
          type: string
        active:
          type: boolean
    EmployeeSummary:
      type: object
      required: [id, full_name, employee_number, active, has_face_reference]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_number:
          type: string
        department:
          type: string
        active:
          type: boolean
        has_face_reference:
          type: boolean
    EmployeeDetail:
      allOf:
        - $ref: '#/components/schemas/EmployeeSummary'
        - type: object
          properties:
            job_title:
              type: string
            phone:
              type: string
            notes:
              type: string
            registration_date:
              type: string
              format: date
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    FaceEnrollmentRequest:
      type: object
      properties:
        sample_count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
    FaceEnrollmentResponse:
      type: object
      required: [employee_id, status, sample_count, enrolled_at]
      properties:
        employee_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [usable]
        sample_count:
          type: integer
        enrolled_at:
          type: string
          format: date-time
    AttendanceVerifyRequest:
      type: object
      required: [employee_id, type]
      properties:
        employee_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [arrival, departure]
    AttendanceVerifyResponse:
      type: object
      required: [result, verification_attempt]
      properties:
        result:
          type: string
          enum: [success, failed, duplicate_blocked]
        message:
          type: string
        verification_attempt:
          $ref: '#/components/schemas/VerificationAttempt'
        attendance_event:
          allOf:
            - $ref: '#/components/schemas/AttendanceEvent'
          nullable: true
    VerificationAttempt:
      type: object
      required: [id, employee_id, guard_id, type_requested, timestamp, result]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        guard_id:
          type: string
          format: uuid
        type_requested:
          type: string
          enum: [arrival, departure]
        timestamp:
          type: string
          format: date-time
        result:
          type: string
          enum: [success, failed, duplicate_blocked]
        similarity_score:
          type: number
          nullable: true
        failure_reason:
          type: string
          nullable: true
        attendance_event_id:
          type: string
          format: uuid
          nullable: true
    AttendanceEvent:
      type: object
      required: [id, employee_id, guard_id, type, timestamp, verification_attempt_id, source]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        guard_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [arrival, departure]
        timestamp:
          type: string
          format: date-time
        verification_attempt_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [auto]
    ShiftActivityItem:
      type: object
      required: [kind, employee_id, employee_name, timestamp, outcome]
      properties:
        kind:
          type: string
          enum: [attendance_event, verification_attempt]
        employee_id:
          type: string
          format: uuid
        employee_name:
          type: string
        type:
          type: string
          enum: [arrival, departure]
        timestamp:
          type: string
          format: date-time
        guard_username:
          type: string
        outcome:
          type: string
          enum: [success, failed, duplicate_blocked]
        failure_reason:
          type: string
          nullable: true
        attendance_event_id:
          type: string
          format: uuid
          nullable: true
    LocalOverview:
      type: object
      required: [date, arrivals, departures, failed_attempts]
      properties:
        date:
          type: string
          format: date
        arrivals:
          type: integer
        departures:
          type: integer
        failed_attempts:
          type: integer
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
