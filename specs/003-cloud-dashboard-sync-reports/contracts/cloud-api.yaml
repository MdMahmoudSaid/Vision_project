openapi: 3.0.3
info:
  title: Cloud Attendance Dashboard API
  version: 0.1.0
  description: >
    Cloud API backing the management dashboard (Owner/Admin/Viewer), the
    local-PC-to-cloud sync ingestion endpoints, manual corrections with audit
    trail, and attendance reports (daily/weekly/monthly/custom) with
    PDF/Excel export. Guard accounts have no access to this API beyond being
    explicitly rejected (spec FR-023). Video/NVR features are out of scope.
servers:
  - url: https://api.example-cloud-dashboard.invalid
    description: Placeholder production URL — actual host decided at deployment (Render/Railway).
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Authenticate a cloud dashboard user (Owner, Admin, or Viewer)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated cloud user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials, inactive/revoked account, or a Guard-role account (never issued a cloud login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sync/batch:
    post:
      summary: Ingest a batch of locally-recorded records pushed by the local PC's sync job
      description: >
        Authenticated with a site sync key (X-Sync-Api-Key), not a user JWT —
        this is a machine-to-machine credential, one per site (research.md §6).
        Idempotent: any record whose id already exists is treated as a
        successful no-op (FR-002). Never used by dashboard users.
      security:
        - syncApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Batch accepted (including any already-existing records, treated as no-ops)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '401':
          description: Invalid or missing sync API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed batch payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees:
    get:
      summary: Browse synced employees (Owner, Admin, Viewer)
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncedEmployee'
        '403':
          description: Guard role or unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/{employee_id}/attendance:
    get:
      summary: Date-by-date attendance history for one employee (Owner, Admin, Viewer)
      parameters:
        - name: employee_id
          in: path
          required: true
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Attendance history, corrected values applied where corrections exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAttendanceHistory'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attendance/corrections:
    post:
      summary: Create a manual correction (Owner, Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionCreate'
      responses:
        '201':
          description: Correction recorded; original record (if any) unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correction'
        '400':
          description: Missing reason, or action/attendance_event_id mismatch (see data-model.md validation rules)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Viewer or Guard role attempted a write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee or referenced attendance event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attendance/corrections/{employee_id}:
    get:
      summary: Full, ordered audit trail of corrections for one employee (Owner, Admin only)
      parameters:
        - name: employee_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ordered list of corrections, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Correction'
        '403':
          description: Viewer or Guard role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/daily:
    get:
      summary: Organization-wide report for one day (Owner, Admin, Viewer)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Daily report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /reports/weekly:
    get:
      summary: Organization-wide report for one week (Owner, Admin, Viewer)
      parameters:
        - name: week_start
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /reports/monthly:
    get:
      summary: Organization-wide report for one calendar month (Owner, Admin, Viewer)
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, example: '2026-07' }
      responses:
        '200':
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /reports/custom:
    get:
      summary: Custom date-range report, optionally scoped to one employee (Owner, Admin, Viewer)
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: employee_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Custom-period report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /reports/export:
    get:
      summary: Export any of the above report types as PDF or Excel
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly, custom] }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, xlsx] }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: week_start
          in: query
          schema: { type: string, format: date }
        - name: month
          in: query
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: employee_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: PDF or Excel file matching the on-screen report exactly (FR-014, FR-015)
          content:
            application/pdf: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}

  /users:
    get:
      summary: List cloud users (Owner only)
      responses:
        '200':
          description: Cloud user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudUser'
        '403':
          description: Non-Owner role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Invite a new cloud user (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudUserInvite'
      responses:
        '201':
          description: Invited user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudUser'
        '403':
          description: Non-Owner role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{user_id}:
    patch:
      summary: Change a cloud user's role or active status (Owner only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudUserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudUser'
        '403':
          description: Non-Owner role, or attempting to set role to guard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    syncApiKey:
      type: apiKey
      in: header
      name: X-Sync-Api-Key

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    CloudUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, viewer] }
        active: { type: boolean }
        invited_by: { type: string, nullable: true }

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        user:
          $ref: '#/components/schemas/CloudUser'

    CloudUserInvite:
      type: object
      required: [email, role, password]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, viewer] }
        # V1 has no outbound-email infrastructure, so the inviting Owner sets
        # an initial password directly (matching the bootstrap-owner script's
        # own email+password pattern) rather than a token-based email invite.
        password: { type: string, minLength: 8 }

    CloudUserUpdate:
      type: object
      properties:
        role: { type: string, enum: [owner, admin, viewer] }
        active: { type: boolean }

    SyncedEmployee:
      type: object
      properties:
        id: { type: string }
        full_name: { type: string }
        employee_number: { type: string }
        department: { type: string, nullable: true }
        active: { type: boolean }
        has_face_reference: { type: boolean }
        synced_at: { type: string, format: date-time }

    SyncBatchRequest:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/SyncedEmployee'
        verification_attempts:
          type: array
          items:
            $ref: '#/components/schemas/SyncedVerificationAttempt'
        attendance_events:
          type: array
          items:
            $ref: '#/components/schemas/SyncedAttendanceEvent'

    SyncedVerificationAttempt:
      type: object
      properties:
        id: { type: string }
        employee_id: { type: string }
        type_requested: { type: string, enum: [arrival, departure] }
        timestamp: { type: string, format: date-time }
        result: { type: string, enum: [success, failed, duplicate_blocked] }
        similarity_score: { type: number, nullable: true }
        failure_reason: { type: string, nullable: true }
        attendance_event_id: { type: string, nullable: true }

    SyncedAttendanceEvent:
      type: object
      properties:
        id: { type: string }
        employee_id: { type: string }
        type: { type: string, enum: [arrival, departure] }
        timestamp: { type: string, format: date-time }
        verification_attempt_id: { type: string }

    SyncBatchResponse:
      type: object
      properties:
        employees_accepted: { type: integer }
        verification_attempts_accepted: { type: integer }
        attendance_events_accepted: { type: integer }

    EmployeeAttendanceHistory:
      type: object
      properties:
        employee_id: { type: string }
        employee_name: { type: string }
        may_be_incomplete: { type: boolean }
        days:
          type: array
          items:
            $ref: '#/components/schemas/ReportRow'

    Correction:
      type: object
      properties:
        id: { type: string }
        employee_id: { type: string }
        attendance_event_id: { type: string, nullable: true }
        action: { type: string, enum: [add_arrival, add_departure, correct_time, change_type] }
        previous_value: { type: object, nullable: true }
        new_value: { type: object }
        reason: { type: string }
        performed_by: { type: string }
        performed_at: { type: string, format: date-time }

    CorrectionCreate:
      type: object
      required: [employee_id, action, new_value, reason]
      properties:
        employee_id: { type: string }
        attendance_event_id: { type: string, nullable: true }
        action: { type: string, enum: [add_arrival, add_departure, correct_time, change_type] }
        new_value: { type: object }
        reason: { type: string, minLength: 1 }

    ReportRow:
      type: object
      properties:
        employee_id: { type: string }
        employee_name: { type: string }
        date: { type: string, format: date }
        arrival_time: { type: string, format: date-time, nullable: true }
        departure_time: { type: string, format: date-time, nullable: true }
        worked_duration_minutes: { type: integer, nullable: true }
        completeness: { type: string, enum: [complete, missing_departure, missing_arrival, no_record] }
        corrected: { type: boolean }

    Report:
      type: object
      properties:
        scope:
          type: object
          properties:
            type: { type: string, enum: [employee, organization] }
            employee_id: { type: string, nullable: true }
        period:
          type: object
          properties:
            granularity: { type: string, enum: [day, week, month, custom] }
            date_from: { type: string, format: date }
            date_to: { type: string, format: date }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReportRow'
        generated_at: { type: string, format: date-time }
        may_be_incomplete: { type: boolean }
